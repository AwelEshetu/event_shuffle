services:
  db:
    image: postgres:16-alpine
    container_name: db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventshuffle} -d ${POSTGRES_DB:-eventshuffle}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file: .env
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/.venv
      UV_LINK_MODE: copy
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]

volumes:
  postgres_data: